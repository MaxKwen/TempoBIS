[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempobis"
version = "0.1.0"
description = "Motion-aware temporal normalization for speed-robust isolated BISINDO recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maximus Quinn Hertada" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.8",
  "mediapipe>=0.10.14",
  "tqdm>=4.65",
]

[project.optional-dependencies]
gru = ["torch>=2.1"]
demo = ["gradio>=4.0", "torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
