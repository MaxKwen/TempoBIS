# TempoBIS default experiment. Every value here is a starting choice, not a tuned result.
paths:
  video_root: auto          # auto = search /kaggle/input for signer*_label*_sample* videos
  work_dir: outputs

extraction:
  pose_model: lite          # lite | full | heavy
  num_workers: 4
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

features:
  hand_fill: interpolate    # interpolate | zero

temporal:
  length: 32
  methods: [uniform, trim_uniform, motion_aware]
  motion_alpha: 0.3         # 0 = pure motion density, 1 = identical to uniform
  motion_smooth: 5
  trim_quantiles: [0.02, 0.98]

split:
  protocol: loso            # loso = 5 folds, each signer held out once | si_signer4 = official SI split
  val_fraction: 0.15

model:
  type: gru                 # gru | mlp
  hidden: 128
  layers: 2
  dropout: 0.3
  epochs: 80
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  patience: 15
  train_speed_aug: true     # also train "uniform + speed augmentation" as a stronger comparator

stress:
  factors: [0.5, 0.75, 1.0, 1.25, 1.5]
  types: [global, core]

seeds: [0, 1, 2]
